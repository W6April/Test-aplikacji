    <script>
        const CURRENT_APP_VERSION = "v70-workouts-restored-smart-supplements";
        try {

            if (codeHistory.length === 0 || codeHistory[codeHistory.length - 1].version !== CURRENT_APP_VERSION) {
                codeHistory.push({ version: CURRENT_APP_VERSION, time: new Date().toLocaleString(), html: pageHtmlSource });
                if (codeHistory.length > 5) codeHistory.shift();
                localStorage.setItem('diet_code_versions_history', JSON.stringify(codeHistory));
            }
        } catch(e) {}

        const firebaseConfig = {
            apiKey: "AIzaSyBifFcGPOzV2KWlXmgzxz0-TbZXT4U_nF8",
            authDomain: "dietaapril.firebaseapp.com",
            projectId: "dietaapril",
            storageBucket: "dietaapril.firebasestorage.app",
            messagingSenderId: "567628046546",
            appId: "1:567628046546:web:9bb0b75805b2c8de414d0b",
            measurementId: "G-QMLZ4RV5NN"
        };

        try {
            firebase.initializeApp(firebaseConfig);
            var db = firebase.firestore();
        } catch(e) {}

        const THEMES = {
            classic: { name: "💧 Klasyczny Niebieski", appBg: "bg-gray-50 text-gray-800", header: "bg-gradient-to-r from-blue-600 to-indigo-600 text-white", headerSub: "bg-blue-800/60", card: "bg-white border-gray-100 shadow-sm text-gray-800", softBox: "bg-blue-50/80 border-blue-200 text-blue-900", btn: "bg-blue-600 hover:bg-blue-700 text-white shadow-blue-200", accent: "text-blue-600", nav: "bg-white/95 border-gray-200", tabActive: "text-blue-600 bg-blue-50/80", inputBg: "bg-gray-50 border-gray-200 text-gray-800" },
            floral: { name: "🌸 Kwiatowy Ogród", appBg: "theme-floral-bg text-rose-950", header: "bg-gradient-to-r from-pink-500 via-rose-500 to-fuchsia-500 text-white shadow-rose-200", headerSub: "bg-rose-900/30", card: "bg-white/90 backdrop-blur-sm border-pink-200 shadow-md text-rose-950", softBox: "bg-gradient-to-br from-pink-100/90 to-rose-50/90 border-pink-300 text-rose-900", btn: "bg-gradient-to-r from-pink-500 to-rose-500 text-white shadow-pink-200", accent: "text-rose-600", nav: "bg-rose-50/95 border-pink-200", tabActive: "text-rose-600 bg-pink-100/80", inputBg: "bg-pink-50/50 border-pink-200 text-rose-950" },
            meadow: { name: "🌿 Wiosenna Łąka", appBg: "theme-nature-bg text-emerald-950", header: "bg-gradient-to-r from-emerald-600 via-teal-500 to-green-600 text-white", headerSub: "bg-emerald-900/40", card: "bg-white/90 backdrop-blur-sm border-emerald-200 shadow-md text-emerald-950", softBox: "bg-gradient-to-br from-emerald-100/80 to-teal-50/80 border-emerald-300 text-emerald-900", btn: "bg-gradient-to-r from-emerald-500 to-teal-600 text-white shadow-emerald-200", accent: "text-emerald-600", nav: "bg-emerald-50/95 border-emerald-200", tabActive: "text-emerald-700 bg-emerald-100/80", inputBg: "bg-emerald-50/50 border-emerald-200 text-emerald-950" },
            sunset: { name: "🌅 Letni Zachód", appBg: "theme-sunset-bg text-amber-950", header: "bg-gradient-to-r from-orange-500 via-amber-500 to-pink-500 text-white", headerSub: "bg-orange-900/30", card: "bg-white/90 backdrop-blur-sm border-orange-200 shadow-md text-amber-950", softBox: "bg-gradient-to-r from-orange-100/80 to-pink-100/80 border-orange-300 text-orange-900", btn: "bg-gradient-to-r from-orange-500 to-pink-500 text-white shadow-orange-200", accent: "text-orange-600", nav: "bg-orange-50/95 border-orange-200", tabActive: "text-orange-600 bg-orange-100/80", inputBg: "bg-orange-50/40 border-orange-200 text-amber-950" },
            dark: { name: "🌙 Nocny Neon", appBg: "theme-dark-bg text-slate-100", header: "bg-gradient-to-r from-violet-900 via-purple-900 to-slate-900 text-white border-b border-purple-700", headerSub: "bg-black/40", card: "bg-slate-800/90 border-slate-700 shadow-lg text-slate-100", softBox: "bg-slate-800 border-purple-500/40 text-purple-200", btn: "bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white", accent: "text-fuchsia-400", nav: "bg-slate-900/95 border-slate-800 text-slate-400", tabActive: "text-fuchsia-400 bg-slate-800", inputBg: "bg-slate-700 border-slate-600 text-white placeholder-slate-400" }
        };

        const DEFAULT_CATEGORIES = ['Białkowe i Nabiał', 'Węglowodany', 'Tłuszcze', 'Owoce i Warzywa', 'Gotowe Posiłki', 'Inne'];

        const FULL_PRODUCTS = [
            { id: "c1", category: "Gotowe Posiłki", name: "Kanapki z łososiem wędzonym i serkiem", baseWeight: 190, baseKcal: 380, baseP: 24.0, baseF: 10.0, baseC: 48.0 },
            { id: "c5", category: "Białkowe i Nabiał", name: "Go Active Protein Kaszka (200g)", baseWeight: 200, baseKcal: 170, baseP: 8.0, baseF: 4.0, baseC: 18.0 },
            { id: "c7", category: "Gotowe Posiłki", name: "4 jajka sadzone + 1/2 awokado na tłuszczu", baseWeight: 290, baseKcal: 385, baseP: 25.5, baseF: 30.0, baseC: 6.5 },
            { id: "w1", category: "Gotowe Posiłki", name: "Wrap domowy (porcja)", baseWeight: 260, baseKcal: 339, baseP: 27.1, baseF: 9, baseC: 35.3 },
            { id: "hb1", category: "Białkowe i Nabiał", name: "Fruvita Skyr naturalny (150g)", baseWeight: 150, baseKcal: 98, baseP: 18, baseF: 0, baseC: 6.2 },
            { id: "hb4", category: "Białkowe i Nabiał", name: "Go Active Protein Pudding (200g)", baseWeight: 200, baseKcal: 152, baseP: 20, baseF: 3, baseC: 11 },
            { id: "hb8", category: "Białkowe i Nabiał", name: "Go Active Serek wiejski (200g)", baseWeight: 200, baseKcal: 184, baseP: 28, baseF: 6, baseC: 4.6 },
            { id: "r1", category: "Białkowe i Nabiał", name: "Pierś z kurczaka (surowa)", baseWeight: 100, baseKcal: 98, baseP: 21.5, baseF: 1.3, baseC: 0 },
            { id: "r23", category: "Białkowe i Nabiał", name: "Jajko kurze (1 sztuka)", baseWeight: 55, baseKcal: 77, baseP: 6.9, baseF: 5.3, baseC: 0.3 },
            { id: "r38", category: "Węglowodany", name: "Płatki owsiane górskie (5 łyżek)", baseWeight: 50, baseKcal: 188, baseP: 6, baseF: 3.6, baseC: 31.2 },
            { id: "r50", category: "Węglowodany", name: "Chleb żytni razowy (1 kromka)", baseWeight: 35, baseKcal: 78, baseP: 2, baseF: 0.5, baseC: 16 },
            { id: "r60", category: "Tłuszcze", name: "Oliwa z oliwek (1 łyżka)", baseWeight: 10, baseKcal: 88, baseP: 0, baseF: 10, baseC: 0 },
            { id: "r87", category: "Owoce i Warzywa", name: "Banan (1 sztuka)", baseWeight: 120, baseKcal: 116, baseP: 1.2, baseF: 0.4, baseC: 26.2 }
        ];

        var dzis = new Date().toISOString().split('T')[0];

        var localDiaries = {};
        var localProducts = [];
        var localDeletedProducts = [];
        var localSupplements = [];
        try {
            var savedD = localStorage.getItem('diet_local_diaries_vault') || localStorage.getItem('diet_previous_auto_backup');
            if (savedD && savedD !== "null" && savedD !== "undefined") {
                var parsedD = JSON.parse(savedD);
                localDiaries = parsedD.diaries ? parsedD.diaries : parsedD;
            }
            var savedP = localStorage.getItem('diet_local_products_vault');
            if (savedP && savedP !== "null" && savedP !== "undefined") localProducts = JSON.parse(savedP) || [];
            var savedDel = localStorage.getItem('diet_local_deleted_products');
            if (savedDel && savedDel !== "null" && savedDel !== "undefined") localDeletedProducts = JSON.parse(savedDel) || [];
            var savedSup = localStorage.getItem('diet_local_supplements');
            if (savedSup && savedSup !== "null" && savedSup !== "undefined") localSupplements = JSON.parse(savedSup) || [];
        } catch(e) {}

        window.state = {
            tab: 'dziennik',
            isCloudSynced: false,
            users: [{ id: 'u1', name: 'Marek', startDate: dzis }, { id: 'u2', name: 'Marta', startDate: dzis }],
            userId: localStorage.getItem('diet_v15_curr_user') || 'u1',
            theme: localStorage.getItem('diet_v62_theme') || 'classic',
            geminiApiKey: localStorage.getItem('diet_gemini_key') || '',
            products: localProducts, workoutsDb: [], diaries: localDiaries, 
            deletedProductIds: localDeletedProducts,
            supplements: localSupplements, // <--- NOWY MODUŁ GLOBALNY
            settings: { startOfWeek: 1, categories: DEFAULT_CATEGORIES.slice(), measurements: [] },
            collapsedCategories: {},
            date: dzis, 
            summaryView: 'tydzien', summaryOffset: 0, 
            bodyView: 'tydzien', bodyOffset: 0, 
            isEditingGoals: false, importMode: 'full', statusMsg: '',
            prodSearch: '', prodResults: [], selectedProdId: '', inputWeight: '',
            wSearch: '', wResults: [], wInputTime: '', wInputKcal: '', editProdId: null,
            isScanning: false, scannedBarcodeInput: '', scannedProductData: null,
            aiModalOpen: false, aiQueryText: '', aiResultData: null, aiLoading: false, aiAdviceText: '', aiAdviceLoading: false,
            unknownProductModal: false, unknownName: '', unknownWeight: '',
            multiSelect: false, selectedProds: {},
            catModalOpen: false, catModalTargetIds: []
        };

        function initLocalDefaults() {
            if(!state.settings.categories || state.settings.categories.length === 0) {
                state.settings.categories = DEFAULT_CATEGORIES.slice();
            }
            try {
                if (!state.products || !Array.isArray(state.products)) state.products = [];
                FULL_PRODUCTS.forEach(function(bp) {
                    var isDeleted = (state.deletedProductIds || []).includes(String(bp.id));
                    var existsInCustom = state.products.some(function(p) { return String(p.id) === String(bp.id) || p.name.trim().toLowerCase() === bp.name.trim().toLowerCase(); });
                    if (!existsInCustom && !isDeleted) state.products.push(bp);
                });
                state.products.forEach(function(p) { if (!p.category) p.category = 'Inne'; });
            } catch(e) { state.products = FULL_PRODUCTS.slice(); }
        }
        initLocalDefaults();

        function safeMergeDiaries(cloudDiaries, locDiaries) {
            var result = JSON.parse(JSON.stringify(cloudDiaries || {}));
            Object.keys(locDiaries || {}).forEach(function(uid) {
                if (!result[uid]) result[uid] = {};
                Object.keys(locDiaries[uid] || {}).forEach(function(dt) {
                    var cDay = result[uid][dt];
                    var lDay = locDiaries[uid][dt];
                    if (!cDay) {
                        result[uid][dt] = lDay;
                    } else {
                        var cMeals = (cDay.meals || []).length;
                        var lMeals = (lDay.meals || []).length;
                        if (lMeals > cMeals) result[uid][dt].meals = lDay.meals;
                        if (!cDay.weight && lDay.weight) result[uid][dt].weight = lDay.weight;
                        if (lDay.measurements) {
                            if (!cDay.measurements) cDay.measurements = {};
                            Object.keys(lDay.measurements).forEach(function(mId) {
                                if (!cDay.measurements[mId] && lDay.measurements[mId]) cDay.measurements[mId] = lDay.measurements[mId];
                            });
                        }
                    }
                });
            });
            return result;
        }

        if (typeof db !== 'undefined') {
            db.collection("dieta").doc("dane_wspolne").onSnapshot(function(doc) {
                if (doc.exists) {
                    var data = doc.data();
                    if (data.products && data.products.length > 0) { 
                        state.products = data.products.filter(function(p) { return !(state.deletedProductIds || []).includes(String(p.id)); });
                        initLocalDefaults(); 
                    }
                    if (data.workoutsDb) state.workoutsDb = data.workoutsDb;
                    if (data.diaries) state.diaries = safeMergeDiaries(data.diaries, state.diaries);
                    if (data.users) state.users = data.users;
                    if (data.supplements) state.supplements = data.supplements;
                    if (data.settings) {
                        state.settings = data.settings;
                        if(!state.settings.categories) state.settings.categories = DEFAULT_CATEGORIES.slice();
                    }
                }
                state.isCloudSynced = true;
                localStorage.setItem('diet_local_diaries_vault', JSON.stringify(state.diaries));
                localStorage.setItem('diet_local_products_vault', JSON.stringify(state.products));
                localStorage.setItem('diet_local_supplements', JSON.stringify(state.supplements));
                if (!state.isScanning) render();
            }, function(err) { if (!state.isScanning) render(); });
        }

        window.saveState = function() {
            try {
                localStorage.setItem('diet_local_diaries_vault', JSON.stringify(state.diaries));
                localStorage.setItem('diet_local_products_vault', JSON.stringify(state.products));
                localStorage.setItem('diet_local_deleted_products', JSON.stringify(state.deletedProductIds));
                localStorage.setItem('diet_local_supplements', JSON.stringify(state.supplements));
                localStorage.setItem('diet_v15_curr_user', state.userId);
                localStorage.setItem('diet_v62_theme', state.theme);
                localStorage.setItem('diet_gemini_key', state.geminiApiKey);
            } catch(e) {}
            if (!state.isCloudSynced) return;
            if (typeof db !== 'undefined') {
                db.collection("dieta").doc("dane_wspolne").set({
                    products: state.products, workoutsDb: state.workoutsDb, diaries: state.diaries, users: state.users, settings: state.settings, supplements: state.supplements
                }, { merge: true }).catch(function(e){});
            }
        };

        window.setTheme = function(th) { state.theme = th; saveState(); render(); };
        window.saveGeminiKey = function(key) { state.geminiApiKey = key.trim(); saveState(); state.statusMsg = 'Zapisano klucz AI!'; render(); };

        // --- SCHOWEK PRZEGLĄDARKI ---
        window.copyMealsToClipboard = function() {
            var day = getDayData();
            if(!day.meals || day.meals.length === 0) return alert('Brak posiłków do skopiowania.');
            
            var text = "Posiłki (Data: " + state.date + "):\n";
            day.meals.forEach(function(m, i) {
                text += (i+1) + ". " + m.name + " - " + m.weight + "g (" + m.kcal + " kcal)\n";
            });
            text += "Razem: " + day.meals.reduce(function(acc, m){ return acc + m.kcal; }, 0) + " kcal";

            navigator.clipboard.writeText(text).then(function() {
                alert('Posiłki skopiowane do schowka! Możesz je teraz wkleić w Wiadomości czy Notatniku.');
            }).catch(function() { alert('Nie udało się skopiować.'); });
        };

        // --- DATA POMOCNICZA ---
        window.getPrevDayStr = function(dateStr) {
            var parts = dateStr.split('-');
            var d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
            d.setDate(d.getDate()-1);
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        };

        // --- MULTI-SELECT & CATEGORIES ---
        window.toggleMultiSelect = function() { state.multiSelect = !state.multiSelect; state.selectedProds = {}; render(); };
        window.toggleProdSelect = function(id) { if (state.selectedProds[id]) delete state.selectedProds[id]; else state.selectedProds[id] = true; render(); };
        window.promptBulkMove = function() {
            var ids = Object.keys(state.selectedProds).filter(function(id) { return state.selectedProds[id]; });
            if(ids.length === 0) return alert('Nie zaznaczono żadnych produktów.');
            openCatModal(ids);
        };
        window.promptBulkDelete = function() {
            var ids = Object.keys(state.selectedProds).filter(function(id) { return state.selectedProds[id]; });
            if(ids.length === 0) return alert('Nie zaznaczono żadnych produktów.');
            if (confirm('Trwale usunąć zaznaczone produkty (' + ids.length + ')?')) {
                ids.forEach(function(id) {
                    var sId = String(id);
                    if (!state.deletedProductIds.includes(sId)) state.deletedProductIds.push(sId);
                    state.products = state.products.filter(function(x) { return String(x.id) !== sId; });
                });
                state.multiSelect = false; state.selectedProds = {};
                saveState(); render();
            }
        };

        window.moveCat = function(idx, dir) {
            var cats = state.settings.categories;
            var targetIdx = idx + dir;
            if (targetIdx >= 0 && targetIdx < cats.length) {
                var tmp = cats[idx]; cats[idx] = cats[targetIdx]; cats[targetIdx] = tmp;
                saveState(); render();
            }
        };
        window.editCat = function(idx) {
            var cats = state.settings.categories; var oldName = cats[idx];
            var newName = prompt('Zmień nazwę kategorii:', oldName);
            if (newName && newName.trim() && newName.trim() !== oldName) {
                var trimmed = newName.trim(); cats[idx] = trimmed;
                state.products.forEach(function(p) { if (p.category === oldName) p.category = trimmed; });
                saveState(); render();
            }
        };
        window.delCat = function(idx) {
            var cats = state.settings.categories; var catToDel = cats[idx];
            if (confirm('Usunąć kategorię „' + catToDel + '”? Produkty zostaną przeniesione do „Inne”.')) {

                        '<p class="text-[10px] font-bold text-rose-900 mb-1.5">Coś poszło nie tak po aktualizacji?</p>' +
                        '<button onclick="rollbackToPreviousVersion()" class="bg-rose-500 hover:bg-rose-600 text-white font-bold py-1.5 px-3 rounded-lg text-[10px] shadow">↩️ Cofnij do poprzedniej wersji kodu</button>' +
                        '</div>';
                }

                if (state.catModalOpen) {
                    html += '<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[70] flex items-end justify-center pb-6 px-2">' +
                            '<div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl animate-[slideUp_0.2s_ease-out]">' +
                            '<div class="p-4 bg-gray-50 border-b flex justify-between items-center"><h3 class="font-black text-sm text-blue-900">🗂️ Wybierz kategorię</h3><button onclick="closeCatModal()" class="text-gray-400 hover:text-rose-500 font-black text-lg w-8 h-8 flex justify-center items-center">✕</button></div>' +
                            '<div class="max-h-[60vh] overflow-y-auto p-3 space-y-1">';
                    
                    var allCats = state.settings.categories || DEFAULT_CATEGORIES;
                    allCats.forEach(function(c) {
                        var count = state.products.filter(function(p) { return (p.category || 'Inne') === c; }).length;
                        html += '<button onclick="moveToCategory(\'' + c + '\')" class="w-full text-left p-3 rounded-xl hover:bg-blue-50 font-bold text-sm text-gray-800 border border-transparent hover:border-blue-200 transition-colors flex justify-between items-center"><span>📂 ' + c + '</span> <span class="bg-gray-100 text-gray-500 px-2 py-0.5 rounded-md text-xs">' + count + '</span></button>';
                    });
                    
                    var inCount = state.products.filter(function(p) { return (p.category || 'Inne') === 'Inne'; }).length;
                    html += '<button onclick="moveToCategory(\'Inne\')" class="w-full text-left p-3 rounded-xl hover:bg-blue-50 font-bold text-sm text-gray-800 border border-transparent hover:border-blue-200 transition-colors flex justify-between items-center"><span>📂 Inne (Niesklasyfikowane)</span> <span class="bg-gray-100 text-gray-500 px-2 py-0.5 rounded-md text-xs">' + inCount + '</span></button>';
                    
                    html += '<button onclick="addNewCategoryFromModal()" class="w-full mt-3 bg-blue-100 text-blue-700 hover:bg-blue-200 font-black p-3.5 rounded-xl text-xs shadow-sm transition-transform active:scale-95">➕ Dodaj nową kategorię</button>';
                    
                    html += '</div></div></div>';
                }

                var tabs = ['dziennik', 'baza', 'trening', 'podsumowanie', 'kopia'];
                var icons = ['📅','🍎','💪','📊','⚙️'];
                var labels = ['Dziennik','Baza','Ciało','Podsum.','Ustaw.'];
                html += '</div><div class="fixed bottom-0 left-1/2 transform -translate-x-1/2 w-full max-w-md backdrop-blur border-t grid grid-cols-5 p-1 z-50 ' + th.nav + '">';
                tabs.forEach(function(t, idx) {
                    var col = state.tab === t ? th.tabActive : 'opacity-50';
                    var tl = labels[idx];
                    html += '<button onclick="switchTab(\'' + t + '\')" class="flex flex-col items-center justify-center p-1.5 rounded-xl min-w-0 transition-all ' + col + '"><span class="text-xl mb-0.5">' + icons[idx] + '</span><span class="text-[9px] font-bold truncate w-full text-center">' + tl + '</span></button>';
                });
                html += '</div>';
                app.innerHTML = html;
            } catch(globalErr) {
                document.getElementById('app').innerHTML = '<div class="p-6 text-center text-rose-600 mt-20"><h2 class="font-black text-xl mb-2">Błąd wyświetlania</h2><p class="text-xs mb-4">' + globalErr.message + '</p><button onclick="rollbackToPreviousVersion()" class="bg-rose-500 text-white font-bold py-2 px-4 rounded-xl">Cofnij wersję</button></div>';
            }
        };

        window.switchTab = function(t) { if (state.tab === 'baza' && t !== 'baza' && state.isScanning) { stopBarcodeScanner(); } state.tab = t; state.statusMsg = ''; render(); };
        window.switchUser = function(u) { state.userId = u; saveState(); render(); };
        window.changeStartOfWeek = function(val) { state.settings.startOfWeek = parseInt(val); saveState(); render(); };
        window.addWater = function(amount) { if (amount === 0) getDayData().water = 0; else getDayData().water = (parseFloat(getDayData().water) || 0) + amount; saveState(); render(); };
        window.updateMeasurement = function(id, val) { getDayData().measurements[id] = val; saveState(); render(); };
        window.promptAddMeasurement = function() { var name = prompt('Podaj nazwę nowego pomiaru (np. Łydka):'); if(name && name.trim()) { if(!state.settings.measurements) state.settings.measurements = []; state.settings.measurements.push({ id: 'm_' + Date.now(), name: name.trim() }); saveState(); render(); } };
        window.removeMeasurement = function(id) { if(confirm('Usunąć ten pomiar całkowicie ze struktury?')) { state.settings.measurements = state.settings.measurements.filter(function(m) { return m.id !== id; }); saveState(); render(); } };
        
        window.changeWeight = function(val) { getDayData().weight = val; saveState(); render(); };

        // --- SUPLEMENTY ---
        window.promptAddSupplement = function() {
            var name = prompt('Nazwa odżywki (np. Kreatyna, WPC):');
            if(!name || !name.trim()) return;
            var dose = prompt('Dzienna dawka (np. 5):');
            if(!dose || isNaN(parseFloat(dose))) return alert('Błędna dawka!');
            var unit = prompt('Jednostka (np. g, tab, ml):', 'g');
            if(!unit) unit = 'g';
            var startD = prompt('Od kiedy przyjmujesz? (YYYY-MM-DD)', state.date);
            if(!startD) startD = state.date;
            
            if (!state.supplements) state.supplements = [];
            state.supplements.push({ id: Date.now().toString(), name: name.trim(), dose: parseFloat(dose), unit: unit.trim(), startDate: startD, endDate: null });
            saveState(); render();
        };

        window.endSupplement = function(id) {
            var s = state.supplements.find(function(x) { return String(x.id) === String(id); });
            if(s) {
                var endD = prompt('Data zakończenia suplementacji (YYYY-MM-DD):', state.date);
                if(endD) { s.endDate = endD; saveState(); render(); }
            }
        };

        window.changeSuppDose = function(id) {
            var s = state.supplements.find(function(x) { return String(x.id) === String(id); });
            if(s) {
                var newDose = prompt('Podaj nową dzienną dawkę (' + (s.unit || 'g') + '):', s.dose);
                if(newDose && !isNaN(parseFloat(newDose)) && parseFloat(newDose) !== s.dose) {
                    var changeD = prompt('Od kiedy nowa dawka (YYYY-MM-DD)? Wpisz datę:', state.date);
                    if(changeD) {
                        s.endDate = getPrevDayStr(changeD); // Stara dawka kończy się dzień wcześniej
                        state.supplements.push({ id: Date.now().toString(), name: s.name, dose: parseFloat(newDose), unit: s.unit, startDate: changeD, endDate: null });
                        saveState(); render();
                    }
                }
            }
        };

        window.delSupplement = function(id) {
            if(confirm('Całkowicie usunąć ten wpis o suplemencie z całej historii?')) {
                state.supplements = state.supplements.filter(function(x) { return String(x.id) !== String(id); });
                saveState(); render();
            }
        };

        // --- POSIŁKI ---
        window.addMeal = function() {
            var searchInp = document.getElementById('pSearchInp');
            var weightInp = document.getElementById('inpW');
            var query = searchInp ? searchInp.value.trim() : state.prodSearch.trim();
            var w = parseFloat(weightInp ? weightInp.value : state.inputWeight);

            if (!query || isNaN(w) || w <= 0) return alert('Wpisz nazwę posiłku i wagę!');

            var p = state.products.find(function(x) { return String(x.id) === String(state.selectedProdId); }) || 
                    state.products.find(function(x) { return x.name.toLowerCase() === query.toLowerCase(); });

            if (!p) {
                state.unknownProductModal = true; state.unknownName = query; state.unknownWeight = w;
                render(); return;
            }

            var r = w / p.baseWeight;
            getDayData().meals.push({ 
                id: Date.now(), name: p.name, weight: w, 
                kcal: Math.round(p.baseKcal * r), p: Math.round(p.baseP * r * 10) / 10, 
                f: Math.round(p.baseF * r * 10) / 10, c: Math.round(p.baseC * r * 10) / 10 
            });
            state.prodSearch = ''; state.inputWeight = ''; state.selectedProdId = ''; 
            if(searchInp) searchInp.value = ''; if(weightInp) weightInp.value = '';
            saveState(); render();
        };

        window.confirmAddUnknownProduct = function() {
            var name = state.unknownName; var baseW = state.unknownWeight;
            var kcal = parseFloat(document.getElementById('unkKcal').value) || 0;
            var p = parseFloat(document.getElementById('unkP').value) || 0;
            var f = parseFloat(document.getElementById('unkF').value) || 0;
            var c = parseFloat(document.getElementById('unkC').value) || 0;

            if (!kcal) return alert('Podaj kalorie!');
            state.products.unshift({ id: String(Date.now()), name: name, baseWeight: baseW, baseKcal: kcal, baseP: p, baseF: f, baseC: c, category: "Inne" });
            getDayData().meals.push({ id: Date.now(), name: name, weight: baseW, kcal: kcal, p: p, f: f, c: c });
            state.unknownProductModal = false; state.prodSearch = ''; state.inputWeight = '';
            saveState(); render();
        };

        window.delMeal = function(id) { getDayData().meals = getDayData().meals.filter(function(x) { return String(x.id) !== String(id); }); saveState(); render(); };
        window.promptEditMealWeight = function(id) {
            var meal = getDayData().meals.find(function(m) { return String(m.id) === String(id); });
            if(!meal) return;
            var newW = prompt('Nowa waga (g):', meal.weight);
            if(newW && !isNaN(parseFloat(newW))) {
                var w = parseFloat(newW); var r = w / meal.weight;
                meal.weight = w; meal.kcal = Math.round(meal.kcal * r);
                meal.p = Math.round(meal.p * r * 10) / 10; meal.f = Math.round(meal.f * r * 10) / 10; meal.c = Math.round(meal.c * r * 10) / 10;
                saveState(); render();
            }
        };

        window.moveMeal = function(idx, dir) {
            var meals = getDayData().meals;
            if (idx + dir >= 0 && idx + dir < meals.length) {
                var tmp = meals[idx]; meals[idx] = meals[idx + dir]; meals[idx + dir] = tmp;
                saveState(); render();
            }
        };

        window.promptAddProductFromList = function(id) {
            var p = state.products.find(function(x) { return String(x.id) === String(id); });
            if(!p) return;
            var w = prompt('Podaj wagę (g) dla: ' + p.name, p.baseWeight);
            if(w && !isNaN(parseFloat(w))) {
                var weight = parseFloat(w); var r = weight / p.baseWeight;
                getDayData().meals.push({ 
                    id: Date.now(), name: p.name, weight: weight, 
                    kcal: Math.round(p.baseKcal * r), p: Math.round(p.baseP * r * 10) / 10, 
                    f: Math.round(p.baseF * r * 10) / 10, c: Math.round(p.baseC * r * 10) / 10 
                });
                saveState(); render();
            }
        };

        // --- TRENINGI ---
        window.searchWorkout = function(val) {
            state.wSearch = val;
            if (val.trim().length > 0) state.wResults = state.workoutsDb.filter(function(w) { return w.name.toLowerCase().includes(val.trim().toLowerCase()); }).slice(0, 5);
            else state.wResults = [];
            render(); 
            setTimeout(function() { var el = document.getElementById('wNameInp'); if (el) { el.focus(); el.setSelectionRange(val.length, val.length); } }, 0);
        };

        window.selectWorkoutDrop = function(name) {
            var w = state.workoutsDb.find(function(x) { return x.name === name; });
            if (w) { state.wSearch = w.name; state.wInputTime = w.time; state.wInputKcal = w.kcal; state.wResults = []; render(); }
        };

        window.addWorkout = function() {
            var nameInp = document.getElementById('wNameInp');
            var timeInp = document.getElementById('wTime');
            var kcalInp = document.getElementById('wKcal');

            var name = nameInp ? nameInp.value.trim() : state.wSearch.trim();
            var time = parseInt(timeInp ? timeInp.value : state.wInputTime) || 0;
            var kcal = parseInt(kcalInp ? kcalInp.value : state.wInputKcal) || 0;

            if (!name || !kcal) return alert('Podaj nazwę treningu i spalone kalorie!');
            
            if (!state.workoutsDb.find(function(w) { return w.name.toLowerCase() === name.toLowerCase(); })) {
                state.workoutsDb.push({ name: name, time: time, kcal: kcal });
            }
            
            getDayData().workouts.push({ id: Date.now(), name: name, time: time, kcal: kcal });
            state.wSearch = ''; state.wInputTime = ''; state.wInputKcal = ''; state.wResults = []; 
            saveState(); render();
        };

        window.delWorkout = function(id) { 
            getDayData().workouts = getDayData().workouts.filter(function(x) { return String(x.id) !== String(id); }); 
            saveState(); render(); 
        };

        // --- ZARZĄDZANIE PRODUKTAMI W BAZIE ---
        window.startEditProd = function(id) { 
            state.editProdId = id; 
            render(); 
            setTimeout(function() { var el = document.getElementById('prodForm'); if(el) el.scrollIntoView({behavior: 'smooth'}); }, 100); 
        };
        window.cancelEditProd = function() { state.editProdId = null; render(); };

        window.addProd = function() {
            var name = document.getElementById('pName').value.trim();
            var cat = document.getElementById('pCat').value;
            var w = parseFloat(document.getElementById('pW').value) || 100;
            var p = parseFloat(document.getElementById('pP').value) || 0;
            var f = parseFloat(document.getElementById('pF').value) || 0;
            var c = parseFloat(document.getElementById('pC').value) || 0;
            var kElem = document.getElementById('pK');
            var kcal = (kElem && kElem.value !== '') ? parseFloat(kElem.value) : Math.round(p * 4 + c * 4 + f * 9);

            if (!name) return alert('Podaj nazwę!');
            if(state.editProdId) {
                var prod = state.products.find(function(x) { return String(x.id) === String(state.editProdId); });
                if(prod) { prod.name = name; prod.category = cat; prod.baseWeight = w; prod.baseKcal = kcal; prod.baseP = p; prod.baseF = f; prod.baseC = c; }
                state.editProdId = null;
            } else { 
                state.products.unshift({ id: String(Date.now()), name: name, category: cat, baseWeight: w, baseKcal: kcal, baseP: p, baseF: f, baseC: c }); 
            }
            saveState(); render();
        };

        window.delProd = function(id) {
            if (confirm('Usunąć produkt?')) {
                var sId = String(id);
                if (!state.deletedProductIds.includes(sId)) state.deletedProductIds.push(sId);
                state.products = state.products.filter(function(x) { return String(x.id) !== sId; });
                saveState(); render();
            }
        };

        window.toggleCategoryCollapse = function(catName) {
            if (state.collapsedCategories[catName]) delete state.collapsedCategories[catName];
            else state.collapsedCategories[catName] = true;
            render();
        };

        // --- SKANER KODÓW KRESKOWYCH ---
        window.startBarcodeScanner = function() {
            state.isScanning = true;
            state.scannedProductData = null;
            render(); 
            setTimeout(function() {
                if (!window.html5QrcodeScanner) {
                    window.html5QrcodeScanner = new Html5Qrcode("reader");
                }
                window.html5QrcodeScanner.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    function onScanSuccess(decodedText) {
                        window.html5QrcodeScanner.stop().then(function() {
                            state.isScanning = false;
                            state.scannedBarcodeInput = decodedText;
                            fetchProductByBarcode();
                        });
                    },
                    function onScanFailure(error) {}
                ).catch(function(err) {
                    alert("Błąd aparatu: " + err);
                    state.isScanning = false; render();
                });
            }, 300);
        };

        window.stopBarcodeScanner = function() {
            if (window.html5QrcodeScanner) {
                window.html5QrcodeScanner.stop().then(function() {
                    state.isScanning = false; render();
                }).catch(function() { state.isScanning = false; render(); });
            } else {
                state.isScanning = false; render();
            }
        };

        window.fetchProductByBarcode = function() {
            var code = (state.scannedBarcodeInput || '').trim();
            if (!code) return alert('Wpisz kod EAN!');
            fetch('https://world.openfoodfacts.org/api/v0/product/' + code + '.json')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.status === 1 && data.product) {
                        var p = data.product; var nut = p.nutriments || {};
                        state.scannedProductData = {
                            name: p.product_name || 'Zeskanowany produkt',
                            baseWeight: 100,
                            baseKcal: nut['energy-kcal_100g'] || 0,
                            baseP: nut['proteins_100g'] || 0,
                            baseF: nut['fat_100g'] || 0,
                            baseC: nut['carbohydrates_100g'] || 0,
                            addWeight: 100
                        };
                    } else {
                        alert('Nie znaleziono w bazie OpenFoodFacts. Wprowadź dane ręcznie.');
                        state.scannedProductData = { name: 'Produkt (' + code + ')', baseWeight: 100, baseKcal: 0, baseP: 0, baseF: 0, baseC: 0, addWeight: 100 };
                    }
                    render();
                }).catch(function(err) { alert('Błąd pobierania danych.'); });
        };

        window.addScannedDirectlyToDiary = function(inputId) {
            var w = parseFloat(document.getElementById(inputId).value);
            if(!w || isNaN(w)) return alert('Podaj wagę!');
            var sp = state.scannedProductData; var r = w / sp.baseWeight;
            getDayData().meals.push({
                id: Date.now(), name: sp.name, weight: w,
                kcal: Math.round(sp.baseKcal * r), p: Math.round(sp.baseP * r * 10)/10,
                f: Math.round(sp.baseF * r * 10)/10, c: Math.round(sp.baseC * r * 10)/10
            });
            state.scannedProductData = null; state.isScanning = false;
            saveState(); render();
        };

        window.confirmAddScannedProduct = function(isUpdate) {
            var sp = state.scannedProductData;
            sp.baseWeight = parseFloat(document.getElementById('scannedPkgWeightInput').value) || 100;
            sp.baseKcal = parseFloat(document.getElementById('scannedPkgKcalInput').value) || 0;
            sp.baseP = parseFloat(document.getElementById('scannedPkgPInput').value) || 0;
            sp.baseF = parseFloat(document.getElementById('scannedPkgFInput').value) || 0;
            sp.baseC = parseFloat(document.getElementById('scannedPkgCInput').value) || 0;
            state.products.unshift({
                id: String(Date.now()), name: sp.name, category: 'Inne',
                baseWeight: sp.baseWeight, baseKcal: sp.baseKcal, baseP: sp.baseP, baseF: sp.baseF, baseC: sp.baseC
            });
            state.scannedProductData = null; state.isScanning = false;
            saveState(); render();
        };

        window.openAiModal = function() { state.aiModalOpen = true; render(); };
        window.closeAiModal = function() { state.aiModalOpen = false; render(); };

        render();
    </script>
</body>
</html>
